services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-croissant}
      POSTGRES_USER: ${POSTGRES_USER:-croissant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-croissant} -d ${POSTGRES_DB:-croissant}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - croissant_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-croissant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-croissant}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - croissant_internal

volumes:
  postgres_data:

networks:
  croissant_internal:
    driver: bridge
